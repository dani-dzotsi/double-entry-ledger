services:
  postgres_db:
    image: postgres:16-alpine
    container_name: ledger_db
    environment:
      POSTGRES_USER: ${DBUSER}
      POSTGRES_DB: ${DBNAME}
      POSTGRES_PASSWORD: "${DBPASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER} -d ${DBNAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    

volumes:
  postgres_data: